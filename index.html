const CFG = {"revealSeconds": 15.0, "zoomFrom": 1.0, "zoomTo": 1.1, "zoomSeconds": 18.0, "driftX": -0.02, "driftY": 0.005};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const S = canvas.width;

// --- fit the traced coordinates to the canvas, once, from every region.
// Measuring the full set up front keeps the composition locked while it paints;
// measuring only what has been drawn so far makes the artwork jump around.
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const region of regions) {
  for (const p of region.contour) {
    if (p[0] < minX) minX = p[0];
    if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1];
    if (p[1] > maxY) maxY = p[1];
  }
}
const width  = maxX - minX;
const height = maxY - minY;
// Reserve headroom for the push-in: the artwork is sized so the FINAL zoomed
// state fits the canvas, which is why it starts small and grows into frame.
const fit    = Math.min(S / width, S / height) * 0.94 / Math.max(1, CFG.zoomTo);
const centerX = (minX + maxX) / 2;
const centerY = (minY + maxY) / 2;

function css(c) {
  return 'rgb(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ')';
}

function path(region) {
  ctx.beginPath();
  const run = pts => {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  };
  run(region.contour);
  if (region.holes) for (const h of region.holes) run(h);
}

function paint(region) {
  path(region);
  ctx.fillStyle = css(region.color);
  ctx.fill('evenodd');
  // Re-stroke the same colour: adjacent polygons are antialiased on both sides,
  // which leaves hairline black seams along every shared edge. A 1px stroke of
  // the fill colour closes them.
  ctx.strokeStyle = ctx.fillStyle;
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

const easeInOut = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

let start = null;
let drawn = 0;

function frame(now) {
  if (start === null) start = now;
  const elapsed = (now - start) / 1000;

  // --- slow push-in, applied to the whole composition
  const zt = CFG.zoomSeconds > 0 ? Math.min(elapsed / CFG.zoomSeconds, 1) : 1;
  const zoom = CFG.zoomFrom + (CFG.zoomTo - CFG.zoomFrom) * easeInOut(zt);
  const panX = CFG.driftX * S * easeInOut(zt);
  const panY = CFG.driftY * S * easeInOut(zt);

  const target = CFG.revealSeconds > 0
    ? Math.floor(regions.length * Math.min(elapsed / CFG.revealSeconds, 1))
    : regions.length;

  // The transform changes every frame, so the canvas is repainted from scratch
  // and `drawn` only tracks how much of the artwork has been revealed.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, S, S);

  const s = fit * zoom;
  ctx.setTransform(s, 0, 0, s, S/2 - centerX*s + panX, S/2 - centerY*s + panY);

  drawn = Math.max(drawn, target);
  for (let i = 0; i < drawn; i++) paint(regions[i]);

  if (drawn < regions.length || zt < 1) requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
